# CloudPanel vhost for rdcrm.co.in -> RDIC CRM (Docker, 127.0.0.1:7060).
# Paste into CloudPanel > Sites > rdcrm.co.in > Vhost. Deploy the app with:
#   sh deploy/first-deploy.sh --behind-https-proxy
# so it listens on 127.0.0.1:7060 only and uses secure cookies.

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name rdcrm.co.in;
  return 301 https://www.rdcrm.co.in$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name www.rdcrm.co.in www1.rdcrm.co.in;
  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  # Let's Encrypt renewal by CloudPanel.
  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  {{settings}}

  include /etc/nginx/global_settings;

  # The app sets its own CSP/frame headers; nginx adds HSTS for the HTTPS domain.
  add_header Strict-Transport-Security "max-age=31536000" always;

  # Everything, including /static/*.css and *.js, is served by the app.
  location / {
    proxy_pass http://127.0.0.1:7060;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Replace (not append) so a client cannot spoof its IP for login rate limits.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_connect_timeout 60;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    client_max_body_size 10m;
  }
}
